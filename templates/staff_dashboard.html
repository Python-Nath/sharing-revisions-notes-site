{% extends "base.html" %}
{% block titre %}{{ titre }} — Fiches de révision{% endblock %}
{% block contenu %}
  <section class="intro">
    <h1>{{ titre }}</h1>
    <p>Bonjour {{ profil.name }} {{ profil.surname }}.</p>
    <p><a class="bouton bouton-secondaire" href="{{ comptes_url }}">Gérer les comptes</a></p>
  </section>

  <section class="panneau">
    <h2>Choisir un cours</h2>
    <div id="selecteur" class="selecteur"></div>
  </section>
  <p id="statut" class="statut" role="status"></p>
  <section class="panneau">
    <h2>Fiches</h2>
    <div id="fichiers" class="liste"></div>
  </section>
  <div id="staff-config" data-prefix="{{ prefix }}" hidden></div>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='staff.js') }}"></script>
{% endblock %}
